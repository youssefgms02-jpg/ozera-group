<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OZERA GROUP Account Access</title><style>body{font:16px Arial;background:#071116;color:#f4fbfd;display:grid;place-items:center;min-height:100vh}.box{background:#0d1b22;padding:30px;border:1px solid #22c6e8;border-radius:18px;width:min(420px,90vw)}input,button{display:block;width:100%;padding:12px;margin:10px 0;border-radius:9px}input{background:#071116;color:white;border:1px solid #345}button{background:#22c6e8;border:0;font-weight:bold;cursor:pointer}</style></head><body><main class="box"><a href="/">OZERA GROUP</a><h1>Sign in / Create account</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password" required><input id="name" placeholder="Full name (for new accounts)"><button>Continue</button></form><p id="status"></p><a href="/">Back to website</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"></script><script>const db=window.supabase.createClient("https://pltdrbxyrzeyydnfzxib.supabase.co","sb_publishable_KXoLq-gRDYlpfju721L3Gw_wWkYPrOs");document.getElementById('f').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim();const result=name?await db.auth.signUp({email,password,options:{data:{full_name:name}}}):await db.auth.signInWithPassword({email,password});if(result.error){document.getElementById('status').textContent=result.error.message;return}if(name&&!result.data.session){document.getElementById('status').textContent='Check your email to confirm your account.';return}location.href='/account'};</script></body></html>
