<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | OZERA GROUP</title><link rel="icon" href="https://i.ibb.co/cKQ92njD/logo4.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#071116;--surface:#0d1b22;--text:#f4fbfd;--muted:#a9c0c9;--line:rgba(117,220,244,.17);--cyan:#22c6e8;--ice:#8cecff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,rgba(34,198,232,.12),transparent 55%),var(--bg);color:var(--text);font:14px/1.7 'Plus Jakarta Sans',sans-serif;padding:22px}html[dir=rtl] body{font-family:Cairo,sans-serif}.wrap{width:min(1000px,100%);margin:auto}.box,.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin:18px 0}.muted{color:var(--muted)}a{color:var(--ice);text-decoration:none}input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}label{font-size:12px;font-weight:700}.field{display:grid;gap:6px;margin:13px 0}.btn{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(110deg,var(--cyan),var(--ice));color:#031318;font-weight:800;cursor:pointer}.status{color:var(--ice);min-height:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);border-radius:30px;padding:3px 9px;color:var(--ice);font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">◉ OZERA GROUP</a><h1>Admin dashboard</h1><p class="muted">Administrator role required. Access is enforced by database policies.</p><section class="panel"><p id="status" class="status">Verifying access…</p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"></script><script>const sb=window.supabase.createClient("https://pltdrbxyrzeyydnfzxib.supabase.co","sb_publishable_KXoLq-gRDYlpfju721L3Gw_wWkYPrOs");const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){let {data:{user}}=await sb.auth.getUser();if(!user){location.href='/login?next=/admin';return}if(user.app_metadata?.role!=='admin'){$('status').textContent='Access denied. This account is not an administrator.';return}$('status').textContent='Administrator access verified.';let q=await sb.from('service_requests').select('id,user_id,service,budget,details,timeline,status,admin_note,created_at').order('created_at',{ascending:false});if(q.error){$('list').textContent=q.error.message;return}if(!q.data.length){$('list').textContent='No requests yet.';return}$('list').innerHTML=q.data.map(r=>'<article class="item grid"><div><b>'+esc(r.service)+'</b><p class="muted">'+new Date(r.created_at).toLocaleString()+' · '+esc(r.budget)+'</p><p>'+esc(r.details)+'</p><textarea id="note'+r.id+'" placeholder="Customer update / note">'+esc(r.admin_note||'')+'</textarea></div><div><label>Status</label><select id="status'+r.id+'">'+[['received','Received'],['reviewing','Reviewing'],['quoted','Quoted'],['in_progress','In progress'],['completed','Completed'],['cancelled','Cancelled']].map(([v,l])=>'<option value="'+v+'" '+(v===r.status?'selected':'')+'>'+l+'</option>').join('')+'</select><p><button class="btn" onclick="saveRow(\''+r.id+'\')">Save update</button></p><span id="msg'+r.id+'" class="status"></span></div></article>').join('')}window.saveRow=async id=>{let r=await sb.from('service_requests').update({status:$('status'+id).value,admin_note:$('note'+id).value.trim()||null}).eq('id',id);$('msg'+id).textContent=r.error?r.error.message:'Saved.'};init();</script></body></html>
