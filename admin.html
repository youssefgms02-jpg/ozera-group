<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | OZERA GROUP</title><style>body{font:15px/1.7 Arial;background:#071116;color:#f4fbfd;margin:0;padding:25px}.wrap{max-width:1100px;margin:auto}.panel{background:#0d1b22;border:1px solid #244;padding:22px;border-radius:16px;margin:18px 0}.muted{color:#a9c0c9}a{color:#8cecff}select,textarea{display:block;width:100%;box-sizing:border-box;background:#071116;color:white;border:1px solid #345;border-radius:8px;padding:10px;margin:8px 0}textarea{min-height:75px}.btn{padding:10px 15px;background:#22c6e8;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1fr 200px;gap:15px;padding:16px 0;border-bottom:1px solid #345}.status{color:#8cecff}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">OZERA GROUP</a><h1>Admin dashboard</h1><p class="muted">Private request management. Administrator role is checked by both the app and database policies.</p><section class="panel"><p id="status" class="status">Verifying access…</p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"></script><script>const db=window.supabase.createClient("https://pltdrbxyrzeyydnfzxib.supabase.co","sb_publishable_KXoLq-gRDYlpfju721L3Gw_wWkYPrOs");const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='/login?next=/admin';return}if(user.app_metadata?.role!=='admin'){$('status').textContent='Access denied. Administrator permissions are not assigned to this account.';return}$('status').textContent='Administrator access verified.';const q=await db.from('service_requests').select('id,user_id,service,budget,details,timeline,status,admin_note,created_at').order('created_at',{ascending:false});if(q.error){$('list').textContent=q.error.message;return}if(!q.data.length){$('list').textContent='No requests have been submitted yet.';return}$('list').innerHTML=q.data.map(r=>'<article class="row"><div><b>'+esc(r.service)+'</b><p class="muted">'+new Date(r.created_at).toLocaleString()+' · '+esc(r.budget)+' · Customer ID: '+esc(r.user_id)+'</p><p>'+esc(r.details)+'</p><p class="muted">Timeline: '+esc(r.timeline||'Not specified')+'</p><textarea id="note-'+r.id+'" placeholder="Customer update / note">'+esc(r.admin_note||'')+'</textarea></div><div><label>Status</label><select id="status-'+r.id+'"><option value="received">Received</option><option value="reviewing">Reviewing</option><option value="quoted">Quoted</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button class="btn save" data-id="'+r.id+'">Save update</button><p class="status" id="msg-'+r.id+'"></p></div></article>').join('');q.data.forEach(r=>{const s=$('status-'+r.id);s.value=r.status});document.querySelectorAll('.save').forEach(btn=>btn.addEventListener('click',async()=>{const id=btn.dataset.id;btn.disabled=true;const res=await db.from('service_requests').update({status:$('status-'+id).value,admin_note:$('note-'+id).value.trim()||null}).eq('id',id);$('msg-'+id).textContent=res.error?res.error.message:'Saved.';btn.disabled=false}))}init();</script></body></html>
